<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Arena Vector PRO</title>
<style>
body { margin:0; background:#111; overflow:hidden; font-family:Arial; }
canvas { display:block; margin:auto; background:#222; }
#info {
 position:absolute;
 top:10px;
 left:10px;
 color:white;
}
</style>
</head>
<body>

<div id="info">
<h3>Arena Vector PRO</h3>
<p>WASD mover | Espacio golpe | F fuerte | R especial</p>
<p id="levelText"></p>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const levelText = document.getElementById("levelText");

let level = 1;
let maxLevel = 5;

let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// JUGADOR
let player = {
  x:100,
  y:250,
  size:40,
  speed:4,
  health:100,
  damage:2,
  specialCooldown:0,
  powerTimer:0
};

// ENEMIGO
let enemy;

function createEnemy() {
  enemy = {
    x:600,
    y:250,
    size:40,
    speed:1 + level * 0.5,
    health:100 + level * 40,
    damage:0.5 + level * 0.5,
    state:"idle"
  };
}

createEnemy();

// POWER UP
let powerUp = null;

function spawnPowerUp() {
  const types = ["health","speed","damage"];
  const type = types[Math.floor(Math.random()*types.length)];
  powerUp = {
    x: Math.random()*750,
    y: Math.random()*450,
    size:20,
    type:type
  };
}

setInterval(() => {
  if(!powerUp) spawnPowerUp();
}, 5000);

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function updatePlayer(){
  if(keys["w"]) player.y -= player.speed;
  if(keys["s"]) player.y += player.speed;
  if(keys["a"]) player.x -= player.speed;
  if(keys["d"]) player.x += player.speed;

  if(keys[" "] && distance(player,enemy)<60){
    enemy.health -= player.damage;
  }

  if(keys["f"] && distance(player,enemy)<70){
    enemy.health -= player.damage*3;
  }

  if(keys["r"] && player.specialCooldown<=0){
    if(distance(player,enemy)<100){
      enemy.health -= player.damage*6;
      player.specialCooldown = 200;
    }
  }

  if(player.specialCooldown>0) player.specialCooldown--;

  if(player.powerTimer>0){
    player.powerTimer--;
  }
}

function updateEnemy(){
  let dist = distance(player,enemy);

  if(dist>200) enemy.state="idle";
  else if(dist>60) enemy.state="chase";
  else enemy.state="attack";

  if(enemy.state==="chase"){
    let dx = player.x - enemy.x;
    let dy = player.y - enemy.y;
    let len = Math.hypot(dx,dy);
    enemy.x += (dx/len)*enemy.speed;
    enemy.y += (dy/len)*enemy.speed;
  }

  if(enemy.state==="attack"){
    player.health -= enemy.damage;
  }
}

function checkPowerUp(){
  if(powerUp && distance(player,powerUp)<30){
    if(powerUp.type==="health") player.health+=20;
    if(powerUp.type==="speed"){
      player.speed=7;
      player.powerTimer=300;
    }
    if(powerUp.type==="damage"){
      player.damage=4;
      player.powerTimer=300;
    }
    powerUp=null;
  }

  if(player.powerTimer===0){
    player.speed=4;
    player.damage=2;
  }
}

function nextLevel(){
  if(enemy.health<=0){
    level++;
    if(level>maxLevel){
      alert("¡Has completado todos los niveles!");
      level=1;
    }
    createEnemy();
    player.health=100;
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="lime";
  ctx.fillRect(player.x,player.y,player.size,player.size);

  ctx.fillStyle="red";
  ctx.fillRect(enemy.x,enemy.y,enemy.size,enemy.size);

  if(powerUp){
    if(powerUp.type==="health") ctx.fillStyle="green";
    if(powerUp.type==="speed") ctx.fillStyle="cyan";
    if(powerUp.type==="damage") ctx.fillStyle="orange";
    ctx.fillRect(powerUp.x,powerUp.y,powerUp.size,powerUp.size);
  }

  ctx.fillStyle="green";
  ctx.fillRect(20,20,player.health*2,15);

  ctx.fillStyle="red";
  ctx.fillRect(500,20,enemy.health*1,15);

  levelText.innerText = "Nivel: "+level;
}

function loop(){
  if(player.health>0){
    updatePlayer();
    updateEnemy();
    checkPowerUp();
    nextLevel();
  }
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
