<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Arena Vector</title>

<style>
body{
margin:0;
background:#111;
overflow:hidden;
font-family:Arial;
color:white;
}

canvas{
display:block;
margin:auto;
background:#1b1b1b;
}

#startScreen{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:black;
}

button{
padding:15px 40px;
font-size:20px;
cursor:pointer;
}

#controls{
position:absolute;
top:10px;
right:20px;
text-align:right;
}
</style>
</head>

<body>

<div id="startScreen">
<h1>Arena Vector</h1>
<button onclick="startGame()">Iniciar</button>
<p>Presiona ENTER para comenzar</p>
</div>

<div id="controls">
<h3>Controles</h3>
<p>W A S D → mover</p>
<p>Espacio → golpe</p>
<p>N → golpe fuerte</p>
<p>M → super golpe</p>
</div>

<canvas id="game" width="900" height="550"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const startScreen = document.getElementById("startScreen");

let gameStarted=false;
let level=1;

let keys={};

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;

if(e.key==="Enter" && !gameStarted){
startGame();
}
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

function startGame(){
startScreen.style.display="none";
gameStarted=true;
}

function distance(a,b){
return Math.hypot(a.x-b.x,a.y-b.y);
}

let player={
x:100,
y:250,
size:40,
speed:4,
health:100,
strongAttacks:1,
superAttacks:1
};

let enemy={
x:700,
y:250,
size:40,
speed:2,
health:100
};

let item=null;

function spawnItem(){

const types=["star","heart","diamond"];
const type=types[Math.floor(Math.random()*types.length)];

item={
x:Math.random()*850,
y:Math.random()*500,
size:20,
type:type,
timer:360
};

}

setInterval(()=>{
if(!item && gameStarted){
spawnItem();
}
},4000);

function updatePlayer(){

if(keys["w"]) player.y-=player.speed;
if(keys["s"]) player.y+=player.speed;
if(keys["a"]) player.x-=player.speed;
if(keys["d"]) player.x+=player.speed;

player.x=Math.max(0,Math.min(canvas.width-player.size,player.x));
player.y=Math.max(0,Math.min(canvas.height-player.size,player.y));

if(keys[" "] && distance(player,enemy)<60){
enemy.health-=0.4;
}

if(keys["n"] && player.strongAttacks>0 && distance(player,enemy)<70){
enemy.health-=6;
player.strongAttacks--;
}

if(keys["m"] && player.superAttacks>0 && distance(player,enemy)<90){
enemy.health-=12;
player.superAttacks--;
}

}

function updateEnemy(){

let dx=player.x-enemy.x;
let dy=player.y-enemy.y;

let len=Math.hypot(dx,dy);

if(len!==0){

enemy.x+=(dx/len)*enemy.speed;
enemy.y+=(dy/len)*enemy.speed;

}

if(distance(player,enemy)<45){
player.health-=0.25;
}

}

function updateItem(){

if(!item) return;

item.timer--;

if(distance(player,item)<35){

if(item.type==="heart"){
player.health=Math.min(100,player.health+20);
}

if(item.type==="diamond"){
player.strongAttacks++;
}

if(item.type==="star"){
player.superAttacks++;
}

item=null;
}

if(item && item.timer<=0){
item=null;
}

}

function drawPlayer(){

ctx.fillStyle="#00ff99";
ctx.beginPath();
ctx.arc(player.x,player.y,player.size/2,0,Math.PI*2);
ctx.fill();

}

function drawEnemy(){

ctx.fillStyle="#ff3b3b";
ctx.beginPath();
ctx.rect(enemy.x,enemy.y,enemy.size,enemy.size);
ctx.fill();

}

function drawItem(){

if(!item) return;

if(item.type==="heart"){

ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(item.x,item.y,10,0,Math.PI*2);
ctx.fill();

}

if(item.type==="diamond"){

ctx.fillStyle="cyan";

ctx.beginPath();
ctx.moveTo(item.x,item.y-10);
ctx.lineTo(item.x+10,item.y);
ctx.lineTo(item.x,item.y+10);
ctx.lineTo(item.x-10,item.y);
ctx.closePath();
ctx.fill();

}

if(item.type==="star"){

ctx.fillStyle="yellow";

ctx.beginPath();
ctx.moveTo(item.x,item.y-10);
ctx.lineTo(item.x+4,item.y-2);
ctx.lineTo(item.x+10,item.y);
ctx.lineTo(item.x+4,item.y+2);
ctx.lineTo(item.x,item.y+10);
ctx.lineTo(item.x-4,item.y+2);
ctx.lineTo(item.x-10,item.y);
ctx.lineTo(item.x-4,item.y-2);
ctx.closePath();
ctx.fill();

}

}

function drawUI(){

ctx.fillStyle="green";
ctx.fillRect(20,20,player.health*2,15);

ctx.fillStyle="red";
ctx.fillRect(canvas.width-220,20,enemy.health*2,15);

ctx.fillStyle="white";

ctx.fillText("Golpes fuertes (N): "+player.strongAttacks,20,60);
ctx.fillText("Super golpes (M): "+player.superAttacks,20,80);

ctx.fillText("Nivel: "+level,canvas.width/2-30,20);

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

if(!gameStarted) return;

drawPlayer();
drawEnemy();
drawItem();
drawUI();

if(player.health<=0){

ctx.font="40px Arial";
ctx.fillText("¡Perdiste!",canvas.width/2-100,canvas.height/2);

}

if(enemy.health<=0){

ctx.font="40px Arial";
ctx.fillText("¡Ganaste!",canvas.width/2-100,canvas.height/2);

}

}

function loop(){

if(gameStarted && player.health>0 && enemy.health>0){

updatePlayer();
updateEnemy();
updateItem();

}

draw();

requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
